{% extends "base.html" %}
{% block title %}Publish Tasks{% endblock %}

{% block content %}
<h1 class="h3 mb-3">Paste task list</h1>

<p class="text-muted">One line = one task. Paste straight from WhatsApp. Type <strong>@</strong> to tag an operator.</p>

<div id="mention-wrap" class="mention-wrap position-relative mb-3">
  <textarea id="task-text" class="form-control" rows="12"
            placeholder="Replace motor M4&#10;Inspect generator G2&#10;Check cooling pump P17&#10;Clean oil separator"></textarea>
  <ul id="mention-list" class="mention-list" hidden></ul>
</div>

<button id="publish-btn" class="btn btn-primary btn-lg w-100 py-3">PUBLISH TASKS</button>

<div id="publish-result" class="mt-3"></div>

<hr class="my-4">
<div class="d-flex gap-2">
  <a href="/tech" class="btn btn-outline-secondary flex-fill">Operator view</a>
  <a href="/report" class="btn btn-outline-secondary flex-fill">Report</a>
</div>

<style>
  .mention-list {
    position: absolute; z-index: 1050; left: 0; min-width: 220px; max-width: 100%;
    max-height: 220px; overflow-y: auto; margin: 0; padding: .25rem 0; list-style: none;
    background: #fff; border: 1px solid #ced4da; border-radius: .5rem;
    box-shadow: 0 6px 18px rgba(0,0,0,.18);
  }
  .mention-list li { padding: .5rem .85rem; cursor: pointer; white-space: nowrap; font-size: 1.05rem; }
  .mention-list li.active, .mention-list li:hover { background: #0d6efd; color: #fff; }
  @media (prefers-color-scheme: dark) {
    .mention-list { background: #2b3035; border-color: #495057; color: #e9ecef; }
  }
</style>
{% endblock %}

{% block page_script %}
<script>
const OPERATORS = {{ operators|tojson }};

(function () {
  const ta = document.getElementById("task-text");
  const wrap = document.getElementById("mention-wrap");
  const list = document.getElementById("mention-list");
  let matches = [];
  let active = -1;

  function esc(s) {
    return String(s).replace(/[&<>"']/g,
      c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // The "@query" immediately before the caret (@ at line start or after whitespace).
  function currentMention() {
    const pos = ta.selectionStart;
    const m = ta.value.slice(0, pos).match(/(?:^|\s)@([^\s@]*)$/);
    if (!m) return null;
    return { query: m[1], atIndex: pos - m[1].length - 1, end: pos };
  }

  function hide() { list.hidden = true; matches = []; active = -1; }

  function render() {
    const men = currentMention();
    if (!men) { hide(); return; }
    const q = men.query.toLowerCase();
    matches = OPERATORS.filter(n => n.toLowerCase().includes(q));
    if (!matches.length) { hide(); return; }
    active = 0;
    list.innerHTML = matches
      .map((n, i) => `<li data-i="${i}" class="${i === 0 ? "active" : ""}">${esc(n)}</li>`)
      .join("");
    positionList();
    list.hidden = false;
  }

  // Anchor the dropdown just under the textarea, aligned to its left.
  function positionList() {
    list.style.top = ta.offsetTop + ta.offsetHeight + 2 + "px";
    list.style.left = ta.offsetLeft + "px";
  }

  function setActive(i) {
    active = (i + matches.length) % matches.length;
    [...list.children].forEach((li, idx) => li.classList.toggle("active", idx === active));
    const el = list.children[active];
    if (el) el.scrollIntoView({ block: "nearest" });
  }

  function choose(i) {
    const men = currentMention();
    if (!men || !matches[i]) return;
    const before = ta.value.slice(0, men.atIndex);   // text up to (excluding) '@'
    const after = ta.value.slice(men.end);
    const insert = matches[i] + " ";
    ta.value = before + insert + after;
    const caret = (before + insert).length;
    ta.setSelectionRange(caret, caret);
    hide();
    ta.focus();
  }

  ta.addEventListener("input", render);
  ta.addEventListener("keydown", (e) => {
    if (list.hidden) return;
    if (e.key === "ArrowDown") { e.preventDefault(); setActive(active + 1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); setActive(active - 1); }
    else if (e.key === "Tab" || e.key === "Enter") { e.preventDefault(); choose(active); }
    else if (e.key === "Escape") { e.preventDefault(); hide(); }
  });
  // mousedown (not click) so the textarea keeps focus/caret while we insert
  list.addEventListener("mousedown", (e) => {
    const li = e.target.closest("li");
    if (!li) return;
    e.preventDefault();
    choose(Number(li.dataset.i));
  });
  // clicking outside closes it
  document.addEventListener("mousedown", (e) => { if (!wrap.contains(e.target)) hide(); });
})();

document.getElementById("publish-btn").addEventListener("click", async () => {
  const text = document.getElementById("task-text").value;
  const out = document.getElementById("publish-result");
  if (!text.trim()) { out.innerHTML = '<div class="alert alert-warning">Nothing to publish.</div>'; return; }

  try {
    const res = await fetch("/api/tasks", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text }),
    });
    const data = await res.json();
    if (res.ok) {
      out.innerHTML = `<div class="alert alert-success">Published ${data.count} task(s).</div>`;
      document.getElementById("task-text").value = "";
    } else {
      out.innerHTML = `<div class="alert alert-danger">${data.error || "Error"}</div>`;
    }
  } catch (e) {
    out.innerHTML = '<div class="alert alert-danger">No connection. Publishing requires the server to be reachable.</div>';
  }
});
</script>
{% endblock %}
