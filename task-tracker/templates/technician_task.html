{% extends "base.html" %}
{% block title %}Task{% endblock %}

{% block content %}
<a href="/tech" class="btn btn-link px-0 mb-2">&larr; My Tasks</a>

<h1 id="task-title" class="h3 mb-1">Loading…</h1>
<p class="mb-4"><span id="task-status" class="badge text-bg-secondary">—</span></p>

<!-- Hidden camera inputs (capture opens the rear camera on phones) -->
<input type="file" id="cam-before" accept="image/*" capture="environment" hidden>
<input type="file" id="cam-after"  accept="image/*" capture="environment" hidden>

<div class="d-grid gap-3">
  <button id="btn-before" class="btn btn-primary big-btn">TAKE BEFORE PHOTO</button>
  <button id="btn-after"  class="btn btn-success big-btn" disabled>TAKE AFTER PHOTO</button>
</div>

<div id="task-msg" class="mt-3"></div>
{% endblock %}

{% block page_script %}
<script>
const TASK_ID = {{ task_id }};

function setUI(task) {
  if (!task || !task.status) return;   // ignore missing/garbage records
  if (task.title) document.getElementById("task-title").textContent = task.title;
  const s = task.status;
  const st = document.getElementById("task-status");
  st.textContent = s.toUpperCase();
  st.className = "badge text-bg-" + ({open:"secondary",started:"warning",completed:"success"}[s] || "secondary");

  const before = document.getElementById("btn-before");
  const after  = document.getElementById("btn-after");
  // Before is available only when open; after only when started.
  before.disabled = s !== "open";
  after.disabled  = s !== "started";
  if (s === "completed") { before.disabled = after.disabled = true; }
}

async function loadTask() {
  let task = await TT.db.getTask(TASK_ID);
  if (task) setUI(task);
  try {
    const res = await fetch(`/api/tasks/${TASK_ID}`);
    if (res.ok) { task = await res.json(); setUI(task); }
  } catch (e) { /* offline: keep cached */ }
}

// Downscale + recompress the camera photo to a small JPEG, returned as an
// ArrayBuffer. iOS cameras produce huge (and sometimes HEIC) images; storing
// those raw in IndexedDB freezes Safari. This keeps photos small and reliable.
function photoToJpegBuffer(file, maxDim, quality) {
  maxDim = maxDim || 1600;
  quality = quality || 0.7;
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * scale));
      const h = Math.max(1, Math.round(img.height * scale));
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      canvas.toBlob((blob) => {
        if (!blob) { reject(new Error("toBlob failed")); return; }
        // FileReader is the most widely-supported way to get an ArrayBuffer on iOS
        const fr = new FileReader();
        fr.onload = () => resolve(fr.result);
        fr.onerror = () => reject(fr.error);
        fr.readAsArrayBuffer(blob);
      }, "image/jpeg", quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("image decode failed")); };
    img.src = url;
  });
}

async function capture(photoType, fileInput) {
  const file = fileInput.files[0];
  if (!file) return;
  const msg = document.getElementById("task-msg");
  msg.innerHTML = '<div class="alert alert-info py-2">Processing photo…</div>';

  // Shrink the image (falls back to the original bytes if anything goes wrong).
  let buffer;
  try {
    buffer = await photoToJpegBuffer(file);
  } catch (e) {
    buffer = await file.arrayBuffer();
  }

  // 1. Always save to the offline outbox first (reliability over speed).
  await TT.db.queuePhoto({
    task_id: TASK_ID,
    photo_type: photoType,
    timestamp: new Date().toISOString(),
    buffer: buffer,
  });

  // 2. Optimistically advance status (from the intended value, not the cache,
  //    so the UI is correct even if this job wasn't cached locally).
  const newStatus = photoType === "before" ? "started" : "completed";
  await TT.db.setTaskStatus(TASK_ID, newStatus);
  setUI({ title: document.getElementById("task-title").textContent, status: newStatus });

  msg.innerHTML = '<div class="alert alert-info py-2">Photo saved. Syncing…</div>';

  // 3. Try to sync now; if offline it stays queued and syncs later automatically.
  const ok = await TT.sync.run();
  msg.innerHTML = ok
    ? '<div class="alert alert-success py-2">Saved &amp; synced.</div>'
    : '<div class="alert alert-warning py-2">Saved offline. Will sync automatically when online.</div>';

  fileInput.value = "";
}

document.getElementById("btn-before").addEventListener("click", () => document.getElementById("cam-before").click());
document.getElementById("btn-after").addEventListener("click",  () => document.getElementById("cam-after").click());
document.getElementById("cam-before").addEventListener("change", (e) => capture("before", e.target));
document.getElementById("cam-after").addEventListener("change",  (e) => capture("after",  e.target));

loadTask();
</script>
{% endblock %}
