{% extends "base.html" %}
{% block title %}Task{% endblock %}

{% block content %}
<a href="/tech" class="btn btn-link px-0 mb-2">&larr; My Tasks</a>

<h1 id="task-title" class="h3 mb-1">Loading…</h1>
<p class="mb-4"><span id="task-status" class="badge text-bg-secondary">—</span></p>

<!-- Hidden photo inputs. No `capture` attribute, so the phone offers BOTH
     "Take photo" and "Photo library / gallery" on iOS and Android. -->
<input type="file" id="cam-before"   accept="image/*" hidden>
<input type="file" id="cam-progress" accept="image/*" hidden>
<input type="file" id="cam-after"    accept="image/*" hidden>

<div class="d-grid gap-3">
  <button id="btn-before" class="btn btn-primary big-btn">TAKE BEFORE PHOTO</button>
  <button id="btn-progress" class="btn btn-warning big-btn" disabled>
    ADD PROGRESS PHOTO (<span id="prog-count">0</span>/4)
  </button>
  <button id="btn-after"  class="btn btn-success big-btn" disabled>TAKE AFTER PHOTO</button>
</div>

<div id="task-msg" class="mt-3"></div>
{% endblock %}

{% block page_script %}
<script>
const TASK_ID = {{ task_id }};
let currentStatus = null;
let progressUsed = new Set();   // which progress slots (1..4) are already taken

function setProgressButton() {
  document.getElementById("prog-count").textContent = progressUsed.size;
  // Progress photos are only allowed *between* start and end, up to 4.
  document.getElementById("btn-progress").disabled =
    currentStatus !== "started" || progressUsed.size >= 4;
}

function setUI(task) {
  if (!task || !task.status) return;   // ignore missing/garbage records
  if (task.title) document.getElementById("task-title").textContent = task.title;
  const s = task.status;
  currentStatus = s;
  const st = document.getElementById("task-status");
  st.textContent = s.toUpperCase();
  st.className = "badge text-bg-" + ({open:"secondary",started:"warning",completed:"success"}[s] || "secondary");

  const before = document.getElementById("btn-before");
  const after  = document.getElementById("btn-after");
  // Before is available only when open; after only when started.
  before.disabled = s !== "open";
  after.disabled  = s !== "started";
  if (s === "completed") { before.disabled = after.disabled = true; }
  setProgressButton();
}

// Rebuild the set of used progress slots from the server list + anything still
// queued offline for this task.
async function refreshProgress(serverTypes) {
  progressUsed = new Set();
  (serverTypes || []).forEach((pt) => {
    const m = /^progress([1-4])$/.exec(pt);
    if (m) progressUsed.add(Number(m[1]));
  });
  const out = await TT.db.getOutbox();
  out.filter((i) => i.task_id === TASK_ID && /^progress[1-4]$/.test(i.photo_type))
     .forEach((i) => progressUsed.add(Number(i.photo_type.slice(-1))));
  setProgressButton();
}

function nextProgressSlot() {
  for (let i = 1; i <= 4; i++) if (!progressUsed.has(i)) return i;
  return null;
}

async function loadTask() {
  let task = await TT.db.getTask(TASK_ID);
  if (task) setUI(task);
  await refreshProgress(task && task.progress);
  try {
    const res = await fetch(`/api/tasks/${TASK_ID}`);
    if (res.ok) { task = await res.json(); setUI(task); await refreshProgress(task.progress); }
  } catch (e) { /* offline: keep cached */ }
}

async function capture(photoType, fileInput, progressSlot) {
  const file = fileInput.files[0];
  if (!file) return;
  const msg = document.getElementById("task-msg");
  msg.innerHTML = '<div class="alert alert-info py-2">Processing photo…</div>';

  // 1. Shrink + save to the offline outbox first (reliability over speed).
  await TT.photo.queue(TASK_ID, photoType, file);

  // 2. Optimistic UI update.
  if (photoType.startsWith("progress")) {
    progressUsed.add(progressSlot);      // progress photos never change status
    setProgressButton();
  } else {
    const newStatus = photoType === "before" ? "started" : "completed";
    await TT.db.setTaskStatus(TASK_ID, newStatus);
    setUI({ title: document.getElementById("task-title").textContent, status: newStatus });
  }

  msg.innerHTML = '<div class="alert alert-info py-2">Photo saved. Syncing…</div>';

  // 3. Try to sync now; if offline it stays queued and syncs later automatically.
  const ok = await TT.sync.run();
  msg.innerHTML = ok
    ? '<div class="alert alert-success py-2">Saved &amp; synced.</div>'
    : '<div class="alert alert-warning py-2">Saved offline. Will sync automatically when online.</div>';

  fileInput.value = "";
}

document.getElementById("btn-before").addEventListener("click", () => TT.photo.choose(document.getElementById("cam-before")));
document.getElementById("btn-after").addEventListener("click",  () => TT.photo.choose(document.getElementById("cam-after")));
document.getElementById("btn-progress").addEventListener("click", () => {
  if (nextProgressSlot()) TT.photo.choose(document.getElementById("cam-progress"));
});
document.getElementById("cam-before").addEventListener("change", (e) => capture("before", e.target));
document.getElementById("cam-after").addEventListener("change",  (e) => capture("after",  e.target));
document.getElementById("cam-progress").addEventListener("change", (e) => {
  const slot = nextProgressSlot();
  if (!slot) { e.target.value = ""; return; }
  capture("progress" + slot, e.target, slot);
});

loadTask();
</script>
{% endblock %}
