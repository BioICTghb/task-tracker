<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Log in — Task Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container" style="max-width: 420px;">
    <div class="card mt-5 shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-3">Task Tracker</h1>
        {% if error %}<div class="alert alert-danger py-2">{{ error }}</div>{% endif %}
        <form method="post">
          <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
          <div class="mb-3">
            <label class="form-label">Name / login</label>
            <input name="username" class="form-control form-control-lg"
                   autocomplete="username" autocapitalize="none" autocorrect="off" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input name="password" type="password" class="form-control form-control-lg"
                   autocomplete="current-password" required>
          </div>
          <button class="btn btn-primary btn-lg w-100 py-3">LOG IN</button>
        </form>
      </div>
    </div>
  </main>
</body>
</html>
