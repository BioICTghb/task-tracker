<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d6efd">
  <title>{% block title %}Task Tracker{% endblock %}</title>

  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.svg') }}">
  <link rel="icon" href="{{ url_for('static', filename='icons/icon-192.svg') }}">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
  <!-- Connection / sync status banner -->
  <div id="net-status" class="net-status net-online">ONLINE</div>

  <main class="container py-3">
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='js/db.js') }}"></script>
  <script src="{{ url_for('static', filename='js/sync.js') }}"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block page_script %}{% endblock %}
</body>
</html>
