<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d6efd">
  <title>{% block title %}Task Tracker{% endblock %}</title>

  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.svg') }}">
  <link rel="icon" href="{{ url_for('static', filename='icons/icon-192.svg') }}">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
  <!-- Connection / sync status banner -->
  <div id="net-status" class="net-status net-online">ONLINE</div>

  {% if current_user %}
  <div class="container d-flex justify-content-between align-items-center pt-2 small no-print">
    <span class="text-muted">{{ current_user.name }}{% if current_user.role == 'manager' %} · manager{% endif %}</span>
    <span>
      {% if current_user.role == 'manager' %}
        <a href="/manage/tasks" class="me-3">Edit tasks</a>
        <a href="/report" class="me-3">Report</a>
        <a href="/admin" class="me-3">Operators</a>
      {% endif %}
      <form method="post" action="/logout" class="d-inline">
        <button class="btn btn-link btn-sm p-0 align-baseline">Log out</button>
      </form>
    </span>
  </div>
  {% endif %}

  <main class="container py-3">
    {% block content %}{% endblock %}
  </main>

  <!-- Photo source chooser (camera vs gallery), shown by photo.js -->
  <div id="photo-source" class="photo-source">
    <div class="photo-source-box">
      <button type="button" class="btn btn-primary big-btn w-100 mb-2" data-src="camera">TAKE PHOTO</button>
      <button type="button" class="btn btn-outline-primary big-btn w-100 mb-2" data-src="gallery">FROM GALLERY</button>
      <button type="button" class="btn btn-link w-100" data-src="cancel">Cancel</button>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/db.js') }}"></script>
  <script src="{{ url_for('static', filename='js/photo.js') }}"></script>
  <script src="{{ url_for('static', filename='js/sync.js') }}"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block page_script %}{% endblock %}
</body>
</html>
