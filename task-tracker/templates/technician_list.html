{% extends "base.html" %}
{% block title %}My Tasks{% endblock %}

{% block content %}
<div id="sched-alert" class="alert alert-danger shadow-sm mb-3 d-none">
  <div class="fw-bold mb-1">&#9888; Your shift changed</div>
  <div id="sched-alert-body" class="mb-2"></div>
  <button id="sched-ack" class="btn btn-light btn-sm fw-semibold w-100">OK, I've seen it</button>
</div>

<div class="dashboard-greeting d-flex justify-content-between align-items-center mb-3">
  <div>
    <div class="h4 mb-0">Hi, {{ current_user.name.split(' ')[0] }}</div>
    <div class="text-muted small" id="today-label"></div>
  </div>
  <div class="avatar-circle">{{ current_user.name[0] }}</div>
</div>

<div class="d-flex gap-2 mb-3">
  <button id="btn-extra" class="icon-tile flex-fill">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    <span>Extra job</span>
  </button>
  {% if show_rent %}
  <button id="btn-rent" class="icon-tile flex-fill">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"></path><path d="M5 10v9a1 1 0 0 0 1 1h3v-6h6v6h3a1 1 0 0 0 1-1v-9"></path></svg>
    <span>Rent</span>
  </button>
  {% endif %}
</div>

<div id="my-schedule-card" class="card mb-3 d-none">
  <div class="card-body py-2">
    <div class="d-flex align-items-center justify-content-between mb-1">
      <span class="small text-muted">My schedule</span>
      <span class="small text-muted" id="week-range-label"></span>
    </div>
    <div class="d-flex align-items-center justify-content-center gap-2 mb-2">
      <button type="button" id="week-prev" class="week-nav-btn" aria-label="Previous week">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <button type="button" id="week-today" class="week-nav-btn week-today-btn" aria-label="Current week" title="Jump to current week">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"></circle></svg>
      </button>
      <button type="button" id="week-next" class="week-nav-btn" aria-label="Next week">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>
    </div>
    <div id="schedule-chips" class="d-flex gap-2"></div>
  </div>
</div>

<div id="task-list" class="d-grid gap-3">
  <div class="text-muted">Loading…</div>
</div>
{% endblock %}

{% block page_script %}
<script>
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g,
    (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

document.getElementById("today-label").textContent =
  new Date().toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" });

function badge(status, onHold) {
  if (onHold) return '<span class="badge text-bg-dark">ON HOLD</span>';
  const map = { open: "secondary", started: "warning", completed: "success" };
  return `<span class="badge text-bg-${map[status] || 'secondary'}">${status.toUpperCase()}</span>`;
}

// Badge marking a job as RENT (rent-paying) or EXTRA (unplanned); "" for normal.
function kindTag(t) {
  if (t.daily_of) return ' <span class="badge text-bg-success">DAILY</span>';
  if (t.is_rent || t.kind === "rent") return ' <span class="badge text-bg-primary">RENT</span>';
  if (t.is_extra || t.kind === "extra") return ' <span class="badge text-bg-info">EXTRA</span>';
  return "";
}

const MY_NAME = {{ current_user.name|tojson }};

// Jobs the manager @-tagged for this operator: called out with a "FOR YOU" badge
// and a highlighted edge (the API already sorts them to the top). Jobs tagged for
// someone else name that person, so the floor can see at a glance whose it is.
function assignTag(t) {
  if (!t.assigned_to) return "";
  if (t.assigned_to === MY_NAME) return ' <span class="badge text-bg-danger">FOR YOU</span>';
  return ` <span class="badge text-bg-light border text-muted">${esc(t.assigned_to)}</span>`;
}

function serverCard(t) {
  const tag = kindTag(t) + assignTag(t);
  const mine = t.assigned_to && t.assigned_to === MY_NAME ? " task-mine" : "";
  // On-hold tasks are not workable: non-clickable, greyed-out card (no link).
  if (t.on_hold) {
    return `<div class="task-card card on-hold">
      <div class="card-body d-flex justify-content-between align-items-center">
        <span class="task-title">${esc(t.title)}${tag}</span>
        <span class="badge text-bg-dark">ON HOLD</span>
      </div></div>`;
  }
  return `<a href="/tech/task/${t.id}" class="task-card card text-decoration-none${mine}">
      <div class="card-body d-flex justify-content-between align-items-center">
        <span class="task-title">${esc(t.title)}${tag}</span>
        ${badge(t.status)}
      </div></a>`;
}

function localCard(j) {
  return `<a href="/tech/extra#${encodeURIComponent(j.localId)}" class="task-card card text-decoration-none">
      <div class="card-body d-flex justify-content-between align-items-center">
        <span class="task-title">${esc(j.title)}${kindTag(j)}</span>
        ${badge(j.status)}
      </div></a>`;
}

function renderAll(serverTasks, localJobs) {
  const el = document.getElementById("task-list");
  const local = (localJobs || []).filter((j) => !j.synced);   // not yet on server
  const html = [...local.map(localCard), ...(serverTasks || []).map(serverCard)].join("");
  el.innerHTML = html || '<div class="text-muted">No tasks.</div>';
}

// Fetch the live list, re-cache it, reconcile offline extra jobs, and re-render.
async function refreshFromNetwork() {
  const res = await fetch("/api/tasks");
  if (!res.ok) return;
  const tasks = await res.json();
  await TT.db.saveTasks(tasks);
  // Reconcile: if the server already has an extra job (matched by key),
  // mark the local copy synced so it isn't shown twice.
  const byKey = {};
  tasks.forEach((t) => { if (t.client_key) byKey[t.client_key] = t; });
  for (const j of await TT.db.getLocalJobs()) {
    if (!j.synced && byKey[j.localId]) {
      j.synced = true; j.serverId = byKey[j.localId].id;
      await TT.db.addLocalJob(j);
    }
  }
  renderAll(tasks, await TT.db.getLocalJobs());
}

// Show cached tasks instantly, then refresh from network and re-cache.
async function load() {
  const localJobs = await TT.db.getLocalJobs();
  const cached = await TT.db.getTasks();
  if (cached.length || localJobs.length) renderAll(cached, localJobs);
  try {
    await refreshFromNetwork();
  } catch (e) {
    if (!cached.length && !localJobs.length) {
      document.getElementById("task-list").innerHTML =
        '<div class="alert alert-info">Offline — no cached tasks yet.</div>';
    }
  }
}

// Create an unplanned job (works offline; syncs later). kind: 'extra' | 'rent'.
async function createUnplanned(kind, promptText) {
  const note = (prompt(promptText) || "").trim();
  if (!note) return;
  const localId = "x-" + ((self.crypto && crypto.randomUUID)
    ? crypto.randomUUID()
    : Date.now() + "-" + Math.random().toString(16).slice(2));
  await TT.db.addLocalJob({
    localId, title: note, status: "open", kind,
    created_at: new Date().toISOString(), synced: false,
  });
  TT.sync.run();   // create on the server now if online (otherwise later)
  location.href = "/tech/extra#" + encodeURIComponent(localId);
}
document.getElementById("btn-extra").addEventListener("click",
  () => createUnplanned("extra", "What is the extra job? (short description)"));
const rentBtn = document.getElementById("btn-rent");
if (rentBtn) rentBtn.addEventListener("click",
  () => createUnplanned("rent", "Rent job — short description of the work"));

load();

// "My schedule": one week at a time, scrollable with prev/today/next.
let scheduleOffset = 0;
async function loadMySchedule() {
  try {
    const res = await fetch(`/api/my-schedule?offset=${scheduleOffset}`);
    if (!res.ok) return;
    const data = await res.json();
    if (!data.on_roster) return;
    document.getElementById("my-schedule-card").classList.remove("d-none");
    document.getElementById("week-range-label").textContent = data.week_label || "";
    document.getElementById("week-today").classList.toggle("active", scheduleOffset === 0);

    const chips = document.getElementById("schedule-chips");
    chips.innerHTML = data.days.map((d) => {
      // Real Excel color-coding, kept as-is, with black text on top.
      const style = d.color ? `background-color:${esc(d.color)}; color:#000;` : "";
      const dayName = d.label.split(" ")[0];
      return `<div class="schedule-chip" style="${style}">
        <div class="schedule-chip-day">${esc(dayName)}</div>
        <div class="schedule-chip-shift">${d.text ? esc(d.text) : "&mdash;"}</div>
      </div>`;
    }).join("");
  } catch (e) { /* offline or not on the roster — just skip the widget */ }
}
// Shift-swap warning: shifts of theirs that changed since they last confirmed.
// Stays up until acknowledged, so a silent swap can't be missed.
async function loadScheduleChanges() {
  try {
    const res = await fetch("/api/schedule-changes");
    if (!res.ok) return;
    const data = await res.json();
    const box = document.getElementById("sched-alert");
    if (!data.count) { box.classList.add("d-none"); return; }
    document.getElementById("sched-alert-body").innerHTML = data.changes
      .map((c) => `<div><strong>${esc(c.label)}</strong> &rarr; ${esc(c.shift)}</div>`).join("");
    box.classList.remove("d-none");
  } catch (e) { /* offline — try again on the next poll */ }
}
document.getElementById("sched-ack").addEventListener("click", async () => {
  try {
    await fetch("/api/schedule-ack", { method: "POST" });
    document.getElementById("sched-alert").classList.add("d-none");
    loadMySchedule();   // reflect the new shifts in the widget
  } catch (e) { /* still offline: banner stays, which is the safe outcome */ }
});
loadScheduleChanges();

document.getElementById("week-prev").addEventListener("click", () => { scheduleOffset -= 1; loadMySchedule(); });
document.getElementById("week-next").addEventListener("click", () => { scheduleOffset += 1; loadMySchedule(); });
document.getElementById("week-today").addEventListener("click", () => { scheduleOffset = 0; loadMySchedule(); });
loadMySchedule();

// Light auto-refresh so manager changes (e.g. a task put on hold, or newly
// published tasks) appear without a manual reload. Only when the tab is visible
// and online, so there's no background churn or offline flicker.
function pollIfActive() {
  if (document.visibilityState === "visible" && navigator.onLine) {
    refreshFromNetwork().catch(() => {});
    loadScheduleChanges();      // surface a shift swap without a reload
  }
}
setInterval(pollIfActive, 20000);
document.addEventListener("visibilitychange", pollIfActive);
</script>
{% endblock %}
